<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 390" width="680" height="390" role="img" aria-labelledby="title desc">
<title id="title">Figure 203 illustration: annular cylinder with right radial section (not a caption-only result)</title>
<desc id="desc">Figure 203 shows a short annular cylindrical body with a rectangular radial cross section, viewed in perspective about a vertical symmetry axis. The body has inner cylindrical radius a, outer cylindrical radius b, and axial height h. A radial cut on the right side exposes a vertical rectangular section extending from the inner cylindrical surface to the outer cylindrical surface through the full height h. The labels a and b denote distances from the central axis to the inner and outer cylindrical surfaces, respectively, and h denotes the vertical height of the exposed rectangular section.</desc>
