<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 690 500" role="img" aria-labelledby="title desc">
<title id="title">Figure 203: caption-only reconstruction of a ring with rectangular cross section</title>
<desc id="desc">Figure 203 shows a ring-shaped body with rectangular cross section, centered on a common vertical axis. Its inner radius is a, its outer radius is b, and its axial height is h. The shaded radial section indicates the rectangular cross section of the ring. A chosen perspective cutaway exposes the radial section.</desc>
