<title id="title">Figure 203: ring and rectangular radial section, reconstructed from caption geometry</title>
<desc id="desc">Figure 203 shows a ring-shaped body with rectangular cross section, centered on a common vertical axis. Its inner radius is a, its outer radius is b, and its axial height is h. The shaded radial section indicates the rectangular cross section of the ring. The intact body and its radial section are shown as separate views.</desc>
